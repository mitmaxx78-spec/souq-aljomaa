<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أعلن — {{site_name}}</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="/sell">
<script src="/theme.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#e0a83c">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <span class="brand">{{site_name}}</span>
  <nav class="tabs">
    <a href="/" data-i18n="nav_home">الرئيسية</a>
    <a href="/auctions" data-i18n="nav_auctions">المزادات</a>
    <a href="/sell" class="is-active" data-i18n="nav_sell">أعلن</a>
    <a href="/me" data-i18n="nav_me">حسابي</a>
  </nav>
  <button class="lang-toggle" id="langToggle" type="button">ع</button>
  <button class="theme-toggle" id="themeToggle" type="button">☀️</button>
</header>

<main>
  <div class="hero">
    <h1 data-i18n="sell_h1">ضيف إعلانك</h1>
    <p data-i18n="sell_sub">عبّي المعلومات، وإعلانك بينشر بعد ما نراجعه (خلال وقت قصير)</p>
  </div>

  <form class="card" id="sellForm">
    <div>
      <label data-i18n="label_kind">نوع الإعلان</label>
      <div class="kind-pick">
        <button type="button" id="pickFixed" class="is-on" data-i18n="kind_fixed">سعر ثابت</button>
        <button type="button" id="pickAuction" data-i18n="kind_auction">مزاد</button>
      </div>
    </div>

    <div>
      <label for="title" data-i18n="label_title">عنوان الإعلان</label>
      <input id="title" maxlength="120" placeholder="مثلاً: ثلاجة LG استعمال خفيف" data-i18n-ph="title_ph" required>
    </div>

    <div>
      <label for="category" data-i18n="label_category">الفئة</label>
      <select id="category" required></select>
      <p class="sub msg err" id="categoryWarning" style="display:none;margin-top:6px"></p>
    </div>

    <div>
      <label for="description" data-i18n="label_description">الوصف</label>
      <textarea id="description" placeholder="اكتب تفاصيل الغرض، الحالة، سبب البيع..." data-i18n-ph="description_ph" required></textarea>
    </div>

    <div id="priceField">
      <label for="priceMinor" data-i18n="label_price">السعر (ل.س)</label>
      <input id="priceMinor" inputmode="numeric" placeholder="مثلاً 500000" data-i18n-ph="price_ph">
    </div>

    <div id="auctionFields" style="display:none">
      <label for="startingPriceMinor" data-i18n="label_start_price">سعر الانطلاق (ل.س)</label>
      <input id="startingPriceMinor" inputmode="numeric" placeholder="مثلاً 100000" data-i18n-ph="start_price_ph">
      <label for="durationHours" style="margin-top:10px" data-i18n="label_duration">مدة المزاد (بالساعات)</label>
      <input id="durationHours" inputmode="numeric" placeholder="48" value="48">
    </div>

    <div>
      <label for="area" data-i18n="label_area">المنطقة</label>
      <input id="area" maxlength="120" placeholder="مثلاً: دمشق - المزة" data-i18n-ph="area2_ph" required>
    </div>

    <div>
      <label data-i18n="label_map">حدد موقعك على الخريطة (اختياري)</label>
      <div id="locateBtn" class="map-locate" data-i18n="locate_btn">📍 اضغط هون لتحدد موقعك، أو دبّس مكانك بالخريطة تحت</div>
      <div id="pickMap" class="pick-map"></div>
      <p class="sub" id="mapCoords" style="margin-top:6px"></p>
    </div>

    <div>
      <label for="images" data-i18n="label_images">روابط صور (اختياري، افصل بينها بفاصلة)</label>
      <input id="images" placeholder="https://...">
    </div>

    <div>
      <label for="sellerName" data-i18n="label_seller_name">اسمك</label>
      <input id="sellerName" maxlength="80" required>
    </div>

    <div>
      <label for="phone" data-i18n="label_phone">رقم تلفونك</label>
      <input id="phone" inputmode="tel" placeholder="09xxxxxxxx" required>
    </div>

    <input type="text" id="website" name="website" autocomplete="off" tabindex="-1" class="visually-hidden" aria-hidden="true">

    <button type="submit" class="primary" id="submitBtn" data-i18n="btn_publish">انشر الإعلان</button>
    <div class="msg" id="formMsg"></div>
  </form>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/app.js"></script>
<script src="/sell.js"></script>
<script src="/widget.js"></script>
<script src="/pwa.js"></script>
<script src="/i18n.js"></script>
</body>
</html>
