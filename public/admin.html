<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>سوق الجمعة — لوحة التحكم</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/admin.css">
</head>
<body>

<header>
  <h1>سوق الجمعة</h1>
  <span class="sub" id="statusText">جاري الفحص…</span>
  <button class="theme-toggle" id="themeToggle" type="button" style="border-radius:999px;width:38px;height:38px;">☀️</button>
</header>

<section id="gate" class="card hidden">
  <strong>مفتاح الإدارة</strong>
  <p class="sub">بينحفظ على هالتلفون بس.</p>
  <label for="keyInput">ADMIN_API_KEY</label>
  <input id="keyInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="الصق المفتاح هون">
  <button class="primary" id="keySave">دخول</button>
  <div id="gateMsg" class="msg"></div>
</section>

<main id="panel" class="hidden">
  <div class="tabs" id="statusTabs">
    <button data-status="PENDING" class="is-active">بانتظار المراجعة</button>
    <button data-status="APPROVED">منشورة</button>
    <button data-status="REJECTED">مرفوضة</button>
    <button data-status="SOLD">مباعة</button>
    <button data-status="ENDED">مزادات خلصت</button>
  </div>

  <div class="card">
    <ul class="rows" id="listingList"><li class="sub">جاري التحميل…</li></ul>
  </div>

  <h2 style="text-align:center">البلاغات والشكاوى</h2>
  <div class="card">
    <div class="tabs" id="reportTabs" style="padding:0 0 8px">
      <button data-rstatus="PENDING" class="is-active">بانتظار</button>
      <button data-rstatus="RESOLVED">انحلت</button>
      <button data-rstatus="DISMISSED">مرفوضة</button>
    </div>
    <ul class="rows" id="reportList"><li class="sub">جاري التحميل…</li></ul>
  </div>

  <div class="card">
    <div class="tabs" id="ticketTabs" style="padding:0 0 8px">
      <button data-kstatus="OPEN" class="is-active">مفتوحة</button>
      <button data-kstatus="CLOSED">مسكرة</button>
    </div>
    <ul class="rows" id="ticketList"><li class="sub">جاري التحميل…</li></ul>
  </div>

  <h2 style="text-align:center">طلبات الشحن</h2>
  <div class="card">
    <div class="tabs" id="topupTabs" style="padding:0 0 8px">
      <button data-tstatus="PENDING" class="is-active">بانتظار</button>
      <button data-tstatus="APPROVED">مقبولة</button>
      <button data-tstatus="REJECTED">مرفوضة</button>
    </div>
    <ul class="rows" id="topupList"><li class="sub">جاري التحميل…</li></ul>
  </div>

  <h2 style="text-align:center">الإعلانات الخارجية (بانرات)</h2>
  <div class="card">
    <div id="adsList"><p class="sub">جاري التحميل…</p></div>
    <form id="adForm" style="margin-top:14px">
      <label for="adTitle">عنوان الإعلان</label>
      <input id="adTitle" required>
      <label for="adImage">رابط الصورة</label>
      <input id="adImage" placeholder="https://..." required>
      <label for="adTarget">رابط الوجهة (لما يضغط عليه)</label>
      <input id="adTarget" placeholder="https://..." required>
      <button class="primary" type="submit">ضيف بانر</button>
      <div class="msg" id="adMsg"></div>
    </form>
  </div>

  <h2 style="text-align:center">نصوص الموقع</h2>
  <div class="card">
    <div id="contentForm"><p class="sub">جاري التحميل…</p></div>
    <button class="primary" id="contentSave">احفظ التعديلات</button>
    <div id="contentMsg" class="msg"></div>
  </div>

  <div style="text-align:center; margin-top:20px">
    <button id="logoutBtn">مسح المفتاح من هالتلفون</button>
  </div>
</main>

<script src="/admin.js"></script>
</body>
</html>
